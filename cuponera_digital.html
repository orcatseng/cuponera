<script>
    function extraerCupones() {
        const txt = document.getElementById('texto_wa').value;
        if (!txt) { alert("¡Falta pegar el texto de WhatsApp!"); return; }

        const matchComp = txt.match(/TIV-[A-Z0-9]+/i);
        const comp = matchComp ? matchComp[0] : "TIV-XXXX";

        const matchNombre = txt.match(/\*(?:Responsable|負責人|Encargado|Nombre|姓名[^*]*):\*\s*(.+)/i);
        const responsable = matchNombre ? matchNombre[1].trim() : "Desconocido";

        let hambu = 0, bondi = 0, mila = 0;
        const mHambu = txt.match(/Hamburguesa x(\d+)/i);
        if (mHambu) hambu = parseInt(mHambu[1]);
        
        const mBondi = txt.match(/Bondiola x(\d+)/i);
        if (mBondi) bondi = parseInt(mBondi[1]);
        
        const mMila = txt.match(/Milanesa x(\d+)/i);
        if (mMila) mila = parseInt(mMila[1]);

        const tirolesa = (txt.match(/Tirolesa/gi) || []).length;
        const palestra = (txt.match(/Palestra/gi) || []).length;
        const arqueria = (txt.match(/Arquería/gi) || []).length; 
        const puentes  = (txt.match(/Puentes/gi) || []).length;

        document.getElementById('tk_titular').innerHTML = `Titular: <strong>${responsable}</strong>`;
        document.getElementById('tk_num').innerText = comp;

        const contenedor = document.getElementById('tk_items');
        contenedor.innerHTML = '';

        function agregarCard(nombreES, nombreZH, cantidad, archivoImg) {
            if (cantidad > 0) {
                const fondo = `linear-gradient(to right, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 100%), url('${archivoImg}')`;
                
                contenedor.innerHTML += `
                    <div class="item-card" style="background-image: ${fondo}; background-size: cover; background-position: center;">
                        <div class="item-text-wrapper">
                            <div class="item-name">${nombreES}</div>
                            <div class="item-zh">${nombreZH}</div>
                        </div>
                        <div class="item-qty">x${cantidad}</div>
                    </div>
                `;
            }
        }

        agregarCard('🍔 Hamburguesa + Papas', '牛肉漢堡 + 薯條', hambu, 'hamburguesa.jpg');
        agregarCard('🥪 Bondiola + Papas', '梅花肉三明治 + 薯條', bondi, 'bondiola.jpg');
        agregarCard('🥩 Milanesa + Papas', '炸肉排三明治 + 薯條', mila, 'milanesa.jpg');
        
        agregarCard('🧗‍♀️ Tirolesa', '高空滑索', tirolesa, 'tirolesa.jpg');
        agregarCard('🧗‍♂️ Palestra', '攀岩牆', palestra, 'palestra.jpg');
        agregarCard('🏹 Arquería', '射箭', arqueria, 'arqueria.jpg');
        agregarCard('🌉 Puentes Aéreos', '高空繩索橋', puentes, 'puentes.jpg');

        if (contenedor.innerHTML === '') {
            contenedor.innerHTML = '<div style="text-align: center; color: #999; margin-top: 40px;">No se registraron cupones de comida ni juegos de aventura.</div>';
        }
    }

    function descargarTicket() {
        const ticket = document.getElementById('ticket_digital');
        
        html2canvas(ticket, { 
            scale: 2, 
            useCORS: true,
            backgroundColor: "#1e1e1e"
        }).then(canvas => {
            canvas.toBlob(function(blob) {
                const comp = document.getElementById('tk_num').innerText;
                const file = new File([blob], `Cuponera_${comp}.jpg`, { type: 'image/jpeg' });

                // Detecta si es un celular y abre el menú nativo para enviar a WhatsApp
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    navigator.share({
                        files: [file],
                        title: `Cuponera ${comp}`,
                        text: '¡Acá tenés tus cupones digitales para Tivoli Park!'
                    }).catch(err => console.log('Intercambio cancelado o fallido:', err));
                } else {
                    // Si es una PC, hace la descarga normal
                    const link = document.createElement('a');
                    link.download = `Cuponera_${comp}.jpg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.9);
                    link.click();
                }
            }, 'image/jpeg', 0.9);
        });
    }
</script>
